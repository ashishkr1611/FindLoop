<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanned QR Item — FindLoop</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background-color: var(--bg-navy-dark); color: white; min-height: 100vh; display: flex; flex-direction: column;">
  <!-- Public Header -->
  <header style="padding: 1rem; border-bottom: 1px solid var(--border-dark); background: rgba(11, 17, 32, 0.8);">
    <div style="max-width: 480px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
      <a href="../index.html" class="brand-logo" style="color: white; font-size: 1.125rem;">
        <div class="brand-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></div>
        <div class="brand-text"><span class="brand-name">Find<span style="color:#14B8A6;">Loop</span></span></div>
      </a>
      <span class="badge badge-safe">🛡️ Privacy Shield Active</span>
    </div>
  </header>

  <main style="flex: 1; max-width: 480px; width: 100%; margin: 0 auto; padding: 2rem 1rem; display: flex; flex-direction: column; justify-content: center; gap: 1.5rem;" id="scan-container">
    <!-- Rendered dynamically -->
  </main>

  <script type="module">
    import { getItemByIdOrToken } from "../js/firestore.js";
    import { getQueryParam } from "../js/utils.js";
    import { initScannerButtons } from "../js/scanner.js";

    initScannerButtons();

    const token = getQueryParam("token") || "FL-8X92K";

    async function initScan() {
      const item = await getItemByIdOrToken(token);
      const container = document.getElementById("scan-container");

      // CASE 1: INVALID / UNKNOWN QR TOKEN
      if (!item || !item.qrActive) {
        container.innerHTML = `
          <div class="card-dark" style="text-align: center; padding: 2.5rem 1.5rem; border-radius: 24px; display: flex; flex-direction: column; gap: 1.25rem;">
            <div style="font-size: 3rem;">⚠️</div>
            <div>
              <h2 style="font-size: 1.35rem; font-weight: 900; color: #F43F5E; margin: 0;">Not a FindLoop QR</h2>
              <p style="font-size: 0.85rem; color: #94A3B8; margin-top: 0.5rem; line-height: 1.5;">
                This QR code is not associated with an active FindLoop item or may have been regenerated by its owner.
              </p>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">
              <button id="open-qr-scanner-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-weight: 800; border-radius: 14px; min-height: 44px;">
                📷 Scan Again
              </button>
              <a href="../index.html" class="btn btn-navy" style="width: 100%; justify-content: center; padding: 0.85rem; font-weight: 700; border-radius: 14px; min-height: 44px;">
                🏠 Back to Home
              </a>
            </div>
          </div>
        `;
        return;
      }

      // CASE 2: ITEM EXISTS BUT IS NOT LOST (SAFE, REGISTERED, RETURNED, REPORTED)
      if (item.status !== "LOST") {
        let statusBadge = "This item is currently marked as safe.";
        let statusColor = "#14B8A6";
        let statusIcon = "🛡️";

        if (item.status === "RETURNED") {
          statusBadge = "This item has already been returned to its owner.";
          statusColor = "#10B981";
          statusIcon = "🎉";
        } else if (item.status === "REPORTED" || item.status === "HANDOVER_READY") {
          statusBadge = "This item has already been reported as found and is in handover processing.";
          statusColor = "#F59E0B";
          statusIcon = "📦";
        } else if (item.status === "SAFE" || item.status === "REGISTERED") {
          statusBadge = "This item is currently marked as safe by its owner.";
          statusColor = "#14B8A6";
          statusIcon = "🛡️";
        }

        container.innerHTML = `
          <div class="card-dark" style="text-align: center; padding: 2.25rem 1.5rem; border-radius: 24px; display: flex; flex-direction: column; gap: 1.25rem;">
            <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(20, 184, 166, 0.15); color: ${statusColor}; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto;">${statusIcon}</div>

            <div>
              <span class="badge" style="background: #334155; color: white; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; margin-bottom: 0.5rem;">
                TAG ID: ${item.itemCode}
              </span>
              <h2 style="font-size: 1.25rem; font-weight: 900; color: white; margin-top: 0.35rem;">
                This item is not currently reported as lost.
              </h2>
              <p style="font-size: 0.85rem; color: ${statusColor}; font-weight: 700; margin-top: 0.35rem;">
                ${statusBadge}
              </p>
            </div>

            <div style="background: #0B1120; border: 1px solid #334155; padding: 1rem; border-radius: 16px; text-align: left; font-size: 0.75rem; color: #CBD5E1; display: flex; gap: 0.75rem; align-items: center;">
              <div style="font-size: 1.25rem;">ℹ️</div>
              <div>
                <strong style="color: white; display: block; margin-bottom: 2px;">No Action Required</strong>
                The item is registered on FindLoop and its owner has not reported it as lost.
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.25rem;">
              <button id="open-qr-scanner-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-weight: 800; border-radius: 14px; min-height: 44px;">
                📷 Scan Another QR Tag
              </button>
              <a href="../index.html" class="btn btn-navy" style="width: 100%; justify-content: center; padding: 0.85rem; font-weight: 700; border-radius: 14px; min-height: 44px;">
                🏠 Back to Home
              </a>
            </div>
          </div>
        `;
        return;
      }

      // CASE 3: ITEM IS LOST -> SHOW FOUND REPORT CARD
      container.innerHTML = `
        <div class="card-dark" style="text-align: center; padding: 2rem; border-radius: 24px; display: flex; flex-direction: column; gap: 1.25rem;">
          <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(13, 148, 136, 0.2); color: var(--teal-light); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto;">🔍</div>

          <div>
            <span class="badge" style="background: #334155; color: white; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; margin-bottom: 0.5rem;">
              TAG ID: ${item.itemCode}
            </span>
            <h1 style="font-size: 1.5rem; font-weight: 900; color: white;">Did you find this item?</h1>
            <p style="font-size: 0.9rem; color: #14B8A6; font-weight: 800; margin-top: 0.35rem;">
              ${item.itemName}
            </p>
            <p style="font-size: 0.75rem; color: #94A3B8; font-weight: 600; margin-top: 2px;">
              Category: ${item.category}
            </p>
          </div>

          <div style="background: #0B1120; border: 1px solid #334155; padding: 1rem; border-radius: 16px; text-align: left; font-size: 0.75rem; color: #CBD5E1; display: flex; gap: 0.75rem; align-items: start;">
            <div style="font-size: 1.25rem;">🛡️</div>
            <div>
              <strong style="color: white; display: block; margin-bottom: 2px;">Owner details are private</strong>
              The owner's phone number, email, and student ID are never shown to the finder.
            </div>
          </div>

          <a href="report-found.html?token=${item.qrToken || item.itemCode}" class="btn btn-primary" style="padding: 1rem; border-radius: 16px; font-weight: 900; font-size: 1rem; width: 100%; justify-content: center; min-height: 48px;">
            📦 I Found This Item →
          </a>
        </div>

        <div style="background: rgba(30, 41, 59, 0.4); border: 1px solid #334155; padding: 1.25rem; border-radius: 16px; display: flex; flex-direction: column; gap: 0.75rem; font-size: 0.75rem;">
          <h3 style="font-weight: 800; color: white;">How does reporting work?</h3>
          <ol style="margin-left: 1.25rem; color: #CBD5E1; display: flex; flex-direction: column; gap: 0.35rem;">
            <li>Tell us where you found it on campus.</li>
            <li>Send an optional anonymous note to the owner.</li>
            <li>Leave it at a safe campus location (Security Desk, Library, Reception).</li>
          </ol>
        </div>

        <div style="text-align: center; font-size: 0.75rem; color: #CBD5E1; display: flex; flex-direction: column; gap: 0.25rem;">
          <p>📍 Please use a monitored campus handover point.</p>
          <p style="font-family: var(--font-mono); font-size: 0.7rem; color: #94A3B8;">Note: This QR tag is not a GPS tracker.</p>
        </div>
      `;
    }

    initScan();
  </script>
</body>
</html>
