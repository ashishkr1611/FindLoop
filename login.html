<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — FindLoop</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: var(--bg-navy-dark); color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
  <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1.5rem; text-align: center;">
    <a href="index.html" class="brand-logo" style="justify-content: center; color: white;">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </div>
      <div class="brand-text">Find<span style="color:#14B8A6;">Loop</span></div>
    </a>

    <div>
      <h2 style="font-size: 1.5rem; font-weight: 800;">Welcome back</h2>
      <p style="font-size: 0.75rem; color: #94A3B8;">Log in to manage your registered belongings and reports.</p>
    </div>

    <div class="card-dark" style="padding: 2rem; border-radius: 24px; text-align: left;">
      <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="form-group">
          <label class="form-label form-label-dark">Campus Email</label>
          <input type="email" id="email" required value="anshubala@gehu.ac.in" placeholder="student@gehu.ac.in" class="form-input form-input-dark">
        </div>

        <div class="form-group">
          <label class="form-label form-label-dark">Password</label>
          <input type="password" id="password" required value="password123" placeholder="••••••••" class="form-input form-input-dark">
        </div>

        <button type="submit" class="btn btn-primary" style="padding: 0.875rem; border-radius: 12px; font-weight: 800; font-size: 0.95rem; margin-top: 0.5rem;">
          Log In →
        </button>
      </form>

      <div style="display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0;">
        <div style="flex: 1; height: 1px; background: #334155;"></div>
        <span style="font-size: 0.75rem; color: #64748B; font-weight: 600;">OR</span>
        <div style="flex: 1; height: 1px; background: #334155;"></div>
      </div>

      <button id="google-login-btn" type="button" class="btn" style="width: 100%; padding: 0.875rem; border-radius: 12px; font-weight: 700; font-size: 0.9rem; background: #1E293B; color: white; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; gap: 0.6rem;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9c-.3-.8-.5-1.7-.5-2.7z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
        Continue with Google
      </button>

      <div style="background: #0B1120; border: 1px solid #334155; padding: 0.75rem; border-radius: 12px; margin-top: 1.25rem; font-size: 0.75rem; color: #94A3B8;">
        <p style="color: #14B8A6; font-weight: 700; margin-bottom: 2px;">💡 Pre-filled Demo Credentials:</p>
        <p>Email: <span style="color: white; font-family: var(--font-mono);">anshubala@gehu.ac.in</span></p>
        <p>Password: <span style="color: white; font-family: var(--font-mono);">password123</span></p>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: #94A3B8; border-top: 1px solid #334155; padding-top: 1rem;">
        Don't have an account? <a href="signup.html" style="color: #14B8A6; font-weight: 700;">Create an account</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { logInUser, logInWithGoogle } from "./js/auth.js";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const user = await logInUser(email, password);
      if (user.role === "admin") {
        window.location.href = "admin/index.html";
      } else {
        window.location.href = "pages/dashboard.html";
      }
    });

    document.getElementById("google-login-btn").addEventListener("click", async () => {
      const user = await logInWithGoogle();
      if (user) {
        window.location.href = "pages/dashboard.html";
      }
    });
  </script>
</body>
</html>
