<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — FindLoop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: var(--bg-navy-dark); color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
  <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 1.5rem; text-align: center;">
    <a href="index.html" class="brand-logo" style="justify-content: center; color: white;">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </div>
      <div class="brand-text"><span class="brand-name">Find<span style="color:#14B8A6;">Loop</span></span></div>
    </a>

    <div>
      <h2 style="font-size: 1.5rem; font-weight: 800;">Create your FindLoop Account</h2>
      <p style="font-size: 0.75rem; color: #94A3B8;">Protect your campus belongings with privacy-first QR tags.</p>
    </div>

    <div class="card-dark" style="padding: 2rem; border-radius: 24px; text-align: left;">
      <form id="signup-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-group">
          <label class="form-label form-label-dark">Full Name *</label>
          <input type="text" id="name" required placeholder="e.g. Anshubala" class="form-input form-input-dark">
        </div>

        <div class="form-group">
          <label class="form-label form-label-dark">Campus Email *</label>
          <input type="email" id="email" required placeholder="student@campus.edu" class="form-input form-input-dark">
        </div>

        <div class="form-group">
          <label class="form-label form-label-dark">Student ID *</label>
          <input type="text" id="studentId" required inputmode="numeric" placeholder="e.g. 260122209" class="form-input form-input-dark">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label class="form-label form-label-dark">Password *</label>
            <input type="password" id="password" required placeholder="••••••••" class="form-input form-input-dark">
          </div>
          <div class="form-group">
            <label class="form-label form-label-dark">Confirm Password *</label>
            <input type="password" id="confirmPassword" required placeholder="••••••••" class="form-input form-input-dark">
          </div>
        </div>

        <div style="background: #0B1120; border: 1px solid #334155; padding: 0.75rem; border-radius: 12px; font-size: 0.75rem; color: #94A3B8; margin-top: 0.25rem;">
          🛡️ We never ask for phone numbers or home addresses.
        </div>

        <button type="submit" class="btn btn-primary" style="padding: 0.875rem; border-radius: 12px; font-weight: 800; font-size: 0.95rem; margin-top: 0.5rem;">
          Create Account →
        </button>
      </form>

      <div style="display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0;">
        <div style="flex: 1; height: 1px; background: #334155;"></div>
        <span style="font-size: 0.75rem; color: #64748B; font-weight: 600;">OR</span>
        <div style="flex: 1; height: 1px; background: #334155;"></div>
      </div>

      <button id="google-signup-btn" type="button" class="btn" style="width: 100%; padding: 0.875rem; border-radius: 12px; font-weight: 700; font-size: 0.9rem; background: #1E293B; color: white; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; gap: 0.6rem;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9c-.3-.8-.5-1.7-.5-2.7z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
        Sign up with Google
      </button>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.75rem; color: #94A3B8; border-top: 1px solid #334155; padding-top: 1rem;">
        Already have an account? <a href="login.html" style="color: #14B8A6; font-weight: 700;">Log in</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { signUpUser, logInWithGoogle } from "./js/auth.js";

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const studentId = document.getElementById("studentId").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      await signUpUser(name, email, studentId, password);
      window.location.href = "pages/dashboard.html";
    });

    document.getElementById("google-signup-btn").addEventListener("click", async () => {
      const user = await logInWithGoogle();
      if (user) {
        window.location.href = "pages/dashboard.html";
      }
    });
  </script>
</body>
</html>
